<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #ffb300;
        --success: #16a34a;
        --border: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top, #fff7ed, var(--bg) 55%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: min(520px, 95vw);
        background: var(--card);
        border-radius: 20px;
        padding: 28px 28px 24px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.15);
        border: 1px solid var(--border);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }

      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
      }

      .status {
        margin-bottom: 16px;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 14px;
        display: none;
      }

      .status.show {
        display: block;
      }

      .status.error {
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
      }

      .status.success {
        background: #ecfdf3;
        color: #166534;
        border: 1px solid #86efac;
      }

      .field {
        margin-bottom: 14px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 15px;
      }

      .rules {
        list-style: none;
        padding: 0;
        margin: 10px 0 18px;
        color: var(--muted);
        font-size: 13px;
      }

      .rules li {
        margin: 6px 0;
      }

      .rules li.ok {
        color: var(--success);
        font-weight: 600;
      }

      button {
        width: 100%;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #111827;
        padding: 14px 18px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .link-row {
        margin-top: 16px;
        text-align: center;
        font-size: 14px;
      }

      .link-row a {
        color: #2563eb;
        text-decoration: none;
      }

      .link-row a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Reset Password</h1>
      <p>Enter a new password for your account.</p>

      <div id="status" class="status"></div>

      <div class="field">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" placeholder="New password" />
      </div>

      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" type="password" placeholder="Confirm password" />
      </div>

      <ul class="rules" id="rules">
        <li id="rule-length">8 to 32 characters</li>
        <li id="rule-upper">At least 1 uppercase letter</li>
        <li id="rule-lower">At least 1 lowercase letter</li>
        <li id="rule-digit">At least 1 number</li>
        <li id="rule-match">Passwords match</li>
      </ul>

      <button id="submit-btn" type="button">Reset password</button>

      <div class="link-row">
        <a id="login-link" href="#">Back to login</a>
      </div>
    </div>

    <script>
      const RESET_PASSWORD_BASE_URL = "{{ reset_password_base_url|escapejs }}";
      const API_BASE_URL = "{{ reset_password_api_base_url|escapejs }}";

      const statusEl = document.getElementById("status");
      const newPassEl = document.getElementById("new-password");
      const confirmPassEl = document.getElementById("confirm-password");
      const submitBtn = document.getElementById("submit-btn");
      const loginLink = document.getElementById("login-link");

      loginLink.href = RESET_PASSWORD_BASE_URL.replace(/\/$/, "") + "/login";

      const rules = {
        length: document.getElementById("rule-length"),
        upper: document.getElementById("rule-upper"),
        lower: document.getElementById("rule-lower"),
        digit: document.getElementById("rule-digit"),
        match: document.getElementById("rule-match"),
      };

      function setStatus(type, message) {
        if (!message) {
          statusEl.className = "status";
          statusEl.textContent = "";
          return;
        }
        statusEl.className = "status show " + type;
        statusEl.textContent = message;
      }

      function validatePassword() {
        const pwd = newPassEl.value || "";
        const confirm = confirmPassEl.value || "";

        const lengthOk = pwd.length >= 8 && pwd.length <= 32;
        const upperOk = /[A-Z]/.test(pwd);
        const lowerOk = /[a-z]/.test(pwd);
        const digitOk = /\d/.test(pwd);
        const matchOk = pwd && pwd === confirm;

        rules.length.classList.toggle("ok", lengthOk);
        rules.upper.classList.toggle("ok", upperOk);
        rules.lower.classList.toggle("ok", lowerOk);
        rules.digit.classList.toggle("ok", digitOk);
        rules.match.classList.toggle("ok", matchOk);

        return lengthOk && upperOk && lowerOk && digitOk && matchOk;
      }

      newPassEl.addEventListener("input", validatePassword);
      confirmPassEl.addEventListener("input", validatePassword);

      function getToken() {
        const params = new URLSearchParams(window.location.search);
        return params.get("token") || "";
      }

      submitBtn.addEventListener("click", async () => {
        const token = getToken();
        if (!token) {
          setStatus("error", "Missing reset token. Please check the link.");
          return;
        }

        if (!validatePassword()) {
          setStatus("error", "Password does not meet the requirements.");
          return;
        }

        submitBtn.disabled = true;
        setStatus("", "");

        try {
          const res = await fetch(
            API_BASE_URL.replace(/\/$/, "") + "/api/accounts/password/reset/",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                token: token,
                new_password: newPassEl.value,
              }),
            }
          );

          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            const detail = data && data.detail;
            const msg = Array.isArray(detail)
              ? detail.join(" ")
              : detail || "Reset failed. Please try again.";
            setStatus("error", msg);
            return;
          }

          setStatus("success", "Password reset successful. You can log in now.");
        } catch (err) {
          setStatus("error", "Reset failed. Please try again.");
        } finally {
          submitBtn.disabled = false;
        }
      });

      validatePassword();
    </script>
  </body>
</html>
